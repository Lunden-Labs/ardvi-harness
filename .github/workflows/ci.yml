name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache-dependency-path: .harness/mcp/go.sum
      - name: Go checks
        working-directory: .harness/mcp
        run: |
          go test -race ./...
          go vet ./...
      - name: Harness checks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n install.sh .harness/scripts/*.sh
          shellcheck --severity=warning install.sh .harness/scripts/*.sh .harness/tests/*.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          make -n help
          for test in .harness/tests/*_test.sh; do bash "$test"; done

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build release image
        run: docker build --build-arg VERSION=ci --build-arg COMMIT="$GITHUB_SHA" -t ardvi-mcp:ci .
      - name: Run MCP image
        run: |
          docker run --rm -d --name ardvi-mcp-ci --read-only --tmpfs /tmp \
            --tmpfs /var/lib/ardvi:mode=0700,uid=65532,gid=65532 \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:18765:8765 ardvi-mcp:ci
          trap 'docker stop ardvi-mcp-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:18765/healthz && break
            sleep 0.1
          done
          docker exec ardvi-mcp-ci /usr/local/bin/ardvi skills list \
            --url http://127.0.0.1:8765/mcp --json > /tmp/ardvi-skills.json
          python3 - <<'PY'
          import json
          value = json.load(open('/tmp/ardvi-skills.json'))
          names = {skill['name'] for skill in value['skills']}
          required = {'communication', 'skills-list', 'writing', 'general-writing', 'humanizer'}
          assert required <= names, required - names
          PY

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache-dependency-path: .harness/mcp/go.sum
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set release version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build host archives
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}; key="${os}_${arch}"
            stage="$(mktemp -d)"
            mkdir -p "$stage/harness"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go -C .harness/mcp build -trimpath \
              -ldflags="-s -w -X main.version=$VERSION -X main.commit=$GITHUB_SHA" \
              -o "$stage/ardvi" ./cmd/ardvi-mcp
            cp install.sh "$stage/"
            cp -a .harness Makefile "$stage/harness/"
            cp README.md LICENSE "$stage/harness/"
            python3 "$stage/harness/.harness/scripts/manage_harness.py" record \
              "$stage/harness/.harness" \
              https://github.com/Lunden-Labs/ardvi-harness.git main "$GITHUB_SHA"
            tar -C "$stage" -czf "dist/ardvi_${key}.tar.gz" .
            rm -rf "$stage"
          done
      - name: Build and publish MCP image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lunden-labs/ardvi-mcp:${{ env.VERSION }}
            ghcr.io/lunden-labs/ardvi-mcp:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Create release manifest
        run: |
          python3 .harness/scripts/release_manifest.py \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --image "ghcr.io/lunden-labs/ardvi-mcp@${{ steps.image.outputs.digest }}" \
            --artifacts dist \
            --output dist/release-manifest.json
          (cd dist && sha256sum ardvi_*.tar.gz release-manifest.json > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
